name: Node CI

on:
  push:
    branches:
      - 'master'
      - '[0-9]+.[0-9]+.x'

  pull_request:
    branches:
      - '*'

jobs:
  codeql:
    name: CodeQL Analysis

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The "www/push.js" generated file is ignored as the source file
      # "src/js/push.js" will be checked.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules
              - www/push.js

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  test:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-27]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Environment Information
        run: |
          node --version
          npm --version
          gradle --version

      - name: npm install and test
        run: |
          npm cit
        env:
          CI: true

      - name: Check for uncommitted changes
        if: ${{ runner.os == 'Linux' }}
        run: |
          npm install --package-lock-only --ignore-scripts

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Changed files detected. Ensure built files are commited and package-lock is synced"
            exit 1
          fi

      - name: Ensure synced versions
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail

          PLUGIN_XML=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("plugin.xml").getroot().get("version"))')
          PACKAGE_JSON=$(npm pkg get version | tr -d '"')

          echo "plugin.xml:   $PLUGIN_XML"
          echo "package.json: $PACKAGE_JSON"

          if [ "$PLUGIN_XML" != "$PACKAGE_JSON" ]; then
            echo "::error::Versions don't match between pacakge and plugin.xml."
            exit 1
          fi
